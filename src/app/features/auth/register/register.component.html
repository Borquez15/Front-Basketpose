<div class="register-screen fade-in">
  <div class="register-box">
    <div class="login-logo">
      <div class="logo-icon">🏀</div>
      <h1>Crear cuenta</h1>
      <p>Únete a BasketPose</p>
    </div>

    <div class="login-form">
      @if (error()) {
        <div class="error-msg">{{ error() }}</div>
      }

      <div class="field">
        <label>Nombre *</label>
        <input type="text" placeholder="Tu nombre" [(ngModel)]="nombre"/>
      </div>

      <div class="form-grid">
        <div class="field">
          <label>Primer apellido *</label>
          <input type="text" placeholder="Apellido paterno" [(ngModel)]="ap_p"/>
        </div>
        <div class="field">
          <label>Segundo apellido</label>
          <input type="text" placeholder="Apellido materno" [(ngModel)]="ap_m"/>
        </div>
      </div>

      <div class="field">
        <label>Correo electrónico *</label>
        <input type="email" placeholder="correo@ejemplo.com" [(ngModel)]="email"/>
      </div>

      <div class="form-grid">
        <div class="field">
          <label>Contraseña *</label>
          <input type="password" placeholder="Mínimo 6 caracteres" [(ngModel)]="password" autocomplete="new-password"/>
        </div>
        <div class="field">
          <label>Confirmar *</label>
          <input type="password" placeholder="Repite la contraseña" [(ngModel)]="confirm" autocomplete="new-password"/>
        </div>
      </div>

      <button class="btn btn-primary btn-full" [disabled]="loading()" (click)="submit()">
        {{ loading() ? 'Creando cuenta…' : 'Registrarse' }}
      </button>

      <button class="btn btn-ghost btn-full" routerLink="/auth/login">← Volver al inicio</button>
    </div>
  </div>
</div>
