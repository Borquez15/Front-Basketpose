<div class="login-screen fade-in">
  <div class="login-box">

    <div class="login-logo">
      <div class="logo-icon">🏀</div>
      <h1>BasketPose</h1>
      <p>Análisis de técnica de tiro</p>
    </div>

    <div class="login-form">
      @if (error()) {
        <div class="error-msg">{{ error() }}</div>
      }

      <div class="field">
        <label>Correo electrónico</label>
        <input type="email" placeholder="correo@ejemplo.com" [(ngModel)]="correo"/>
      </div>

      <div class="field">
        <label>Contraseña</label>
        <div class="input-icon">
          <input [type]="showPass() ? 'text' : 'password'"
                 placeholder="••••••••"
                 [(ngModel)]="password"/>
          <span class="eye" (click)="togglePass()">{{ showPass() ? '🙈' : '👁' }}</span>
        </div>
      </div>

      <button class="btn btn-primary btn-full" [disabled]="loading()" (click)="submit()">
        {{ loading() ? 'Iniciando…' : 'Iniciar sesión' }}
      </button>

      <a class="forgot">¿Olvidaste tu contraseña?</a>

      <div class="or-divider">o</div>

      <div id="google-signin-btn"></div>

      <button class="btn btn-outline btn-full" routerLink="/auth/register">
        Crear cuenta nueva
      </button>
    </div>

  </div>
</div>
